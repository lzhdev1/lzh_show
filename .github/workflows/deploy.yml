name: Deploy lzh_show to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /root/lzh_show || exit 1

            # 服务器到 github.com 的链路偶发超时，重试三次再放弃
            ok=0
            for i in 1 2 3; do
              if git fetch --prune origin main; then ok=1; break; fi
              echo "git fetch failed (attempt $i), retrying in 10s..."
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::server cannot reach github.com, deploy aborted"
              exit 1
            fi

            # 只跟随远端 main，不合并、不产生冲突
            git reset --hard origin/main

            python3 project/AftercareAgent/bootstrap_db.py
            docker exec -i shared-postgres psql -v ON_ERROR_STOP=1 -U ttfarm -d ttfarm < project/TTFarm/db/schema.sql
            python3 docker/migrate_articles.py
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f >/dev/null 2>&1 || true

            echo "deployed commit: $(git rev-parse --short HEAD)"

      - name: Verify site responds
        run: |
          set -euo pipefail
          migrations=(blog_front/db/articles/[0-9][0-9][0-9]-*.json)
          latest="${migrations[-1]}"
          slug=$(jq -er '.[0].slug' "$latest")
          title=$(jq -er '.[0].zh.title' "$latest")
          # /ttfarm/ 会 308 跳到 /ttfarm，必须跟随跳转，否则会把 308 当失败
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' https://lzhshow.top/ttfarm || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && curl -fsS --max-time 10 https://lzhshow.top/aftercare/health \
              && curl -fsSL --max-time 15 "https://lzhshow.top/posts/$slug" \
                | python3 -c 'import html,sys; sys.exit(sys.argv[1] not in html.unescape(sys.stdin.read()))' "$title"; then
              exit 0
            fi
            sleep 6
          done
          echo "site, Aftercare, or migrated article verification failed after deploy"
          exit 1
